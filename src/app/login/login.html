<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">Logowanie</h2>

    <form #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="username">Login</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          #usernameInput="ngModel"
          required
          class="login-input"
          [class.is-invalid]="usernameInput.invalid && usernameInput.touched"
          placeholder="Wpisz login"
          autocomplete="username"
        />
        <p *ngIf="usernameInput.invalid && usernameInput.touched" class="field-error">
          {{ messages.authValidation.loginRequired }}
        </p>
      </div>

      <div class="form-group">
        <label for="password">Hasło</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          #passwordInput="ngModel"
          required
          minlength="8"
          maxlength="64"
          class="login-input"
          [class.is-invalid]="passwordInput.invalid && passwordInput.touched"
          placeholder="Wpisz hasło"
          autocomplete="current-password"
        />
        <p *ngIf="passwordInput.invalid && passwordInput.touched" class="field-error">
          <ng-container *ngIf="passwordInput.hasError('required'); else lengthError">
            {{ messages.authValidation.passwordRequired }}
          </ng-container>
          <ng-template #lengthError>{{ messages.authValidation.passwordLength }}</ng-template>
        </p>
      </div>

      <div class="login-actions">
        <button
          type="button"
          class="login-btn login-btn--primary"
          (click)="onLogin()"
          [disabled]="loginForm.invalid"
        >
          Zaloguj się
        </button>

        <button
          type="button"
          class="login-btn login-btn--secondary"
          (click)="onRegister()"
          [disabled]="loginForm.invalid"
        >
          Zarejestruj się
        </button>
      </div>
    </form>
  </div>
</div>
